<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>生徒入学（作成）</title>
  <style>
    body { font-family: sans-serif; }
    .event-block { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
    .hidden { display: none; }
    button { margin: 3px; }
  </style>
</head>

<body>
  <h1>生徒入学（作成）</h1>

  <label>生徒名：</label>
  <input type="text" id="charName">

  <p>経験値：360</p>
  <p>残り経験値：<span id="expRemain">360</span></p>

  <h2>基礎魔力量</h2>
  <p>
    基礎魔力量：<span id="baseDice">4</span>
    <button id="baseDicePlus">+1</button>
    <button id="baseDiceMinus">-1</button>
  </p>

  <h2>属性</h2>
  <div id="eventsArea"></div>
  <button id="helpBtn">ヘルプ</button>
<div id="modalOverlay" onclick="closeHelpModal()">
  <div id="modalContent" onclick="event.stopPropagation();"></div>
</div><br>
  <button id="createBtn">キャラ作成</button>

  <!-- 確認ダイアログ -->
  <div id="confirmArea" class="hidden">
    <p>経験値が残り <span id="confirmExp"></span> です。よろしいですか？</p>
    <button id="confirmBack">戻る</button>
    <button id="confirmOk">確定</button>
  </div>

  <!-- 作成結果 -->
  <div id="resultArea" class="hidden">
    <p>生徒が入学しました！</p>
    <p>学籍番号：<span id="resultId"></span></p>
    <button id="backHome">プレイヤーホームに戻る</button>
  </div>

  <p id="status"></p>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script src="attributes.js"></script>
  <script src="version.js"></script>
  <script src="helpmodal/modal.js"></script>

  <script>
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let playerRef = null;

    // -------------------------
    // 初期値
    // -------------------------
    let exp = 360;
    let baseDice = 4;

    let events = {
      1: { dice: 0, critical: 10 , maxAchieve: 0 },
      2: { dice: 0, critical: 10 , maxAchieve: 0 },
      3: { dice: 0, critical: 10 , maxAchieve: 0 },
      4: { dice: 0, critical: 10 , maxAchieve: 0 }
    };

    // -------------------------
    // プレイヤー情報読み込み
    // -------------------------
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        location.href = "index.html";
        return;
      }

      //自分のプレイヤーデータセット
      playerRef = db.collection("players").doc(user.uid);
    });

    // -------------------------
    // UI生成（種目）
    // -------------------------
    const eventsArea = document.getElementById("eventsArea");

    for (let i = 1; i <= 4; i++) {
      const div = document.createElement("div");
      div.className = "event-block";
      div.innerHTML = `
        <h3>属性 ${MAGIC_ATTRIBUTES[i]}</h3>
        レベル：<span id="dice${i}">0</span>
        <button id="dicePlus${i}">+1</button>
        <button id="diceMinus${i}">-1</button>
        <br>
        発動抵抗：<span id="critical${i}">10</span>
        <button id="criticalPlus${i}">+1</button>
        <button id="criticalMinus${i}">-1</button>
      `;
      eventsArea.appendChild(div);
    }

    // -------------------------
    // UI更新
    // -------------------------
    function updateUI() {
      document.getElementById("expRemain").innerText = exp;
      document.getElementById("baseDice").innerText = baseDice;

      for (let i = 1; i <= 4; i++) {
        document.getElementById(`dice${i}`).innerText = events[i].dice;
        document.getElementById(`critical${i}`).innerText = events[i].critical;
      }
    }

    // -------------------------
    // 基本ダイス増減
    // -------------------------
    document.getElementById("baseDicePlus").onclick = () => {
      if (exp >= 36) {
        baseDice++;
        exp -= 36;
        updateUI();
      }
    };

    document.getElementById("baseDiceMinus").onclick = () => {
      if (baseDice > 4) {
        baseDice--;
        exp += 36;
        updateUI();
      }
    };

    // -------------------------
    // 種目ダイス・クリティカル増減
    // -------------------------
    for (let i = 1; i <= 4; i++) {
      // dice +1
      document.getElementById(`dicePlus${i}`).onclick = () => {
        if (exp >= 10) {
          events[i].dice++;
          exp -= 10;
          updateUI();
        }
      };

      // dice -1
      document.getElementById(`diceMinus${i}`).onclick = () => {
        if (events[i].dice > 0) {
          events[i].dice--;
          exp += 10;
          updateUI();
        }
      };

      // critical +1（初期値より増やせない）
      document.getElementById(`criticalPlus${i}`).onclick = () => {
        if (events[i].critical < 10) {
          events[i].critical++;
          exp += 50;
          updateUI();
        }
      };

      // critical -1
      document.getElementById(`criticalMinus${i}`).onclick = () => {
        if (events[i].critical > 0 && exp >= 50) {
          events[i].critical--;
          exp -= 50;
          updateUI();
        }
      };
    }

    // -------------------------
    // 作成ボタン → 確認ダイアログ
    // -------------------------
    document.getElementById("createBtn").onclick = () => {
      document.getElementById("confirmExp").innerText = exp;
      document.getElementById("confirmArea").classList.remove("hidden");
    };

    document.getElementById("confirmBack").onclick = () => {
      document.getElementById("confirmArea").classList.add("hidden");
    };

    // -------------------------
    // キャラ作成確定
    // -------------------------
    document.getElementById("confirmOk").onclick = async () => {
      const charName = document.getElementById("charName").value;
      if (!charName) {
        alert("生徒名を入力してください");
        return;
      }
      // ★スタミナ消費
      const ok = await consumeCreateStamina(playerRef);
      if (!ok) return;  // スタミナ不足ならキャラ作成を中断

      const playerId = auth.currentUser.uid;

      // キャラID採番
      const maxIdSnap = await db.collection("characters")
        .orderBy("characterId", "desc")
        .limit(1)
        .get();

      let newId = 1;
      if (!maxIdSnap.empty) {
        newId = maxIdSnap.docs[0].data().characterId + 1;
      }

      const characterData = {
        characterId: newId,
        name: charName,
        baseDice: baseDice,
        events: events,
        createdAt: new Date().toISOString(),
        createdVersion: GAME_VERSION,
        playerId: playerId
      };

      await db.collection("characters").doc(String(newId)).set(characterData);

      // 結果表示
      document.getElementById("resultId").innerText = newId;
      document.getElementById("resultArea").classList.remove("hidden");

      // ボタン無効化
      disableAllButtons();
    };

    // -------------------------
    // キャラ作成スタミナ計算
    // -------------------------
    async function getCreateStamina(playerRef) {
      const snap = await playerRef.get();
      const data = snap.data();

      const maxStamina = 10;
      let stamina = data.create_stamina;

      let lastRecovery = data.last_create_recovery.toDate();
      const now = new Date();

      // ▼ 回復処理（複数回復にも対応）
      while (stamina < maxStamina &&
            now >= new Date(lastRecovery.getTime() + 1000 * 60 * 60)) {

        stamina++;
        lastRecovery = new Date(lastRecovery.getTime() + 1000 * 60 * 60);
      }

      // ▼ 回復が発生した場合のみ書き戻す
      if (stamina !== data.create_stamina) {
        await playerRef.update({
          create_stamina: stamina,
          last_create_recovery: lastRecovery
        });
      }

      return { stamina, lastRecovery };
    }
    // -------------------------
    // スタミナ１消費
    // ------------------------- 
    async function consumeCreateStamina(playerRef) {
      // ▼ まず回復計算を getCreateStamina に任せる（ここが重要）
      const { stamina: currentStamina, lastRecovery } = await getCreateStamina(playerRef);

      const maxStamina = 10;
      const now = new Date();

      // ▼ スタミナ不足
      if (currentStamina <= 0) {
        alert("生徒入学スタミナが足りません！");
        return false;
      }

      // ▼ スタミナ消費
      const newStamina = currentStamina - 1;

      // ▼ ★ MAX → 消費した瞬間に回復タイマーをリセット（②‑B方式の本質）
      let newLastRecovery = lastRecovery;
      if (currentStamina === maxStamina) {
        newLastRecovery = now;
      }

      // ▼ Firestoreへ書き戻し（最終キャラ作成時刻も記録）
      await playerRef.update({
        create_stamina: newStamina,
        last_create_recovery: newLastRecovery,
        last_create_action: now
      });

      return true;
    }
    // -------------------------
    // ボタン無効化
    // ------------------------- 
    function disableAllButtons() {
      const buttons = document.querySelectorAll("button");
      buttons.forEach(btn => {
        if (btn.id !== "backHome") btn.disabled = true;
      });
    }

    // -------------------------
    // ホームへ戻る
    // -------------------------
    document.getElementById("backHome").onclick = () => {
      location.href = "player_home.html";
    };

    //help表示
    document.getElementById("helpBtn").onclick = openHelpModal;
  </script>
</body>
</html>
