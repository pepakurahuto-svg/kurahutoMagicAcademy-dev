<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>全属性バトル</title>
  <style>
    body { font-family: sans-serif; }
    .charBox {
      display: inline-block;   /* 中身の幅に合わせる */
      padding: 0;              /* 余白を消す */
      margin: 0;               /* 余白を消す */
      border: none;            /* 枠線も不要なら消す（任意） */
    }
    .flex {
      display: flex;
      gap: 16px;        /* カード間の余白だけ確保 */
      align-items: flex-start;
      justify-content: flex-start; /* 左寄せ */
    }
    .red { color:red; font-weight:bold; }
    #battleLog p { margin:4px 0; }

    .battleCharCard {
      width: 300px;
      border: 2px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      background: var(--attr-color); /* ★属性カラーを JS から渡す */
    }

    .battleCharCard h3 {
      margin-top: 0;
      color: #333;
    }

    .battleCharCard h4 {
      margin-bottom: 4px;
      color: #555;
      border-bottom: 1px solid #ccc;
      padding-bottom: 2px;
    }

  </style>
</head>

<body>
  <h1>全属性バトル</h1>

  <div class="flex">
    <div class="charBox">
      <h2>自分</h2>
      <div id="myCharInfo"></div>
    </div>

    <div class="charBox">
      <h2 id="enemyTitle"></h2>
      <div id="enemyCharInfo"></div>
    </div>
  </div>

  <h3>バトル説明</h3>
  <p>
    プレイヤーホームで選択した自分の生徒と、<br>
    全属性覇者でバトルを行います。<br>
    勝ち数が同じ場合は、合計威力が高い方が勝ちになります。<br>
    はじめにダイスロールを行ってください。<br>
    ダイスロールの結果で再ロールが行える場合、再ロールボタンが有効になります。<br>
    再ロールが出来る間は再ロールを行ってください。<br>
    最終的に再ロールが出来なくなった時点で結果が表示されます。
  </p>

  <br>
  <button id="helpBtn">ヘルプ</button>
<div id="modalOverlay" onclick="closeHelpModal()">
  <div id="modalContent" onclick="event.stopPropagation();"></div>
</div><br>
  <button id="rollBtn">ダイスロール</button>
  <button id="rerollBtn" disabled>再ロール</button>

  <h3>バトルログ</h3>
  <div id="battleLog"></div>

  <button onclick="location.href='player_home.html'">プレイヤーホームへ戻る</button>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script src="attributes.js"></script>
  <script src="helpmodal/modal.js"></script>

  <script>
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let playerRef = null;

    let myChar = null;
    let enemyChar = null;
    let enemyAttrId = null;
    let battleAttrId = null; //0923battleと違うところ
    let mywins = 0; //0923battleと違うところ
    let ememywins = 0; //0923battleと違うところ
    let drows = 0; //0923battleと違うところ

    let myRolls = [];
    let enemyRolls = [];
    let myCriticalTargets = [];
    let enemyCriticalTargets = [];

    let myAchieve = null;
    let enemyAchieve = null;

    // -------------------------
    // キャラ情報読み込み
    // -------------------------
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        location.href = "index.html";
        return;
      }

      const myId = sessionStorage.getItem("selectedCharId");
      enemyAttrId = 0; //0923battleと違うところ

      if (!myId || !enemyAttrId) {
        alert("生徒または対戦属性が選択されていません");
        location.href = "player_home.html";
        return;
      }

      //自分のプレイヤーデータセット
      playerRef = db.collection("players").doc(user.uid);

      // 自分のキャラ
      const mySnap = await db.collection("characters").doc(myId).get();
      if (!mySnap.exists) {
        alert("自分の生徒情報が取得できませんでした");
        location.href = "player_home.html";
        return;
      }
      myChar = mySnap.data();

      // 全属性チャンピオン情報
      const champSnap = await db.collection("champions").doc(String(enemyAttrId)).get();
      if (!champSnap.exists) {
        alert("この属性の勝ち抜き最優秀生徒が存在しません");
        location.href = "player_home.html";
        return;
      }
      document.getElementById("enemyTitle").innerText =
      `相手（${MAGIC_ATTRIBUTE_CHAMPION[String(enemyAttrId)]}）`;

      const champData = champSnap.data();
      const enemyId = String(champData.championId);
      
      // 自分自身との戦闘禁止
      if (String(myId) === String(enemyId)) {
        alert("自分自身とは対戦できません");
        location.href = "player_home.html";
        return;
      }

      // チャンピオンのキャラ情報
      const enemySnap = await db.collection("characters").doc(enemyId).get();
      if (!enemySnap.exists) {
        alert("勝ち抜き最優秀生徒の生徒情報が取得できませんでした");
        location.href = "player_home.html";
        return;
      }
      enemyChar = enemySnap.data();

      renderCharInfo();
    });

    // -------------------------
    // キャラ情報表示
    // -------------------------
    function renderCharInfo() {
      const myArea = document.getElementById("myCharInfo");
      const enArea = document.getElementById("enemyCharInfo");

      battleAttrId++; //0923battleと違うところ
      const eventNo = String(battleAttrId); //0923battleと違うところ
      const myEvent = myChar.events[eventNo];
      const enEvent = enemyChar.events[eventNo];
      const attrColor = MAGIC_ATTRIBUTE_COLORS[eventNo];

      // -------------------------
      // 自分
      // -------------------------
      const myDiv = document.createElement("div");
      myDiv.className = "battleCharCard";
      myDiv.style.setProperty("--attr-color", attrColor);

      myDiv.innerHTML = `
        <h3>${myChar.name}</h3>
        <p>基礎魔力量：${myChar.baseDice}</p>

        <h4>バトル属性</h4>
        <ul>
          <li>属性：${MAGIC_ATTRIBUTES[eventNo]}</li>
          <li>レベル：${myEvent.dice}</li>
          <li>発動抵抗：${myEvent.critical}</li>
          <li>最大威力：${myEvent.maxAchieve ?? 0}</li>
        </ul>
      `;

      myArea.innerHTML = "";
      myArea.appendChild(myDiv);

      // -------------------------
      // 相手
      // -------------------------
      const enDiv = document.createElement("div");
      enDiv.className = "battleCharCard";
      enDiv.style.setProperty("--attr-color", attrColor);

      enDiv.innerHTML = `
        <h3>${enemyChar.name}</h3>
        <p>基礎魔力量：${enemyChar.baseDice}</p>

        <h4>バトル属性</h4>
        <ul>
          <li>属性：${MAGIC_ATTRIBUTES[eventNo]}</li>
          <li>レベル：${enEvent.dice}</li>
          <li>発動抵抗：${enEvent.critical}</li>
          <li>最大威力：${enEvent.maxAchieve ?? 0}</li>
        </ul>
      `;

      enArea.innerHTML = "";
      enArea.appendChild(enDiv);
    }

    // -------------------------
    // ダイスロール処理
    // -------------------------
    function rollDice(count) {
      const arr = [];
      for (let i = 0; i < count; i++) {
        arr.push(Math.floor(Math.random() * 10) + 1);
      }
      return arr.sort((a,b)=>a-b);
    }

    function renderRollResult(label, arr, critical) {
      return `${label}：` + arr.map(v =>
        v >= critical ? `<span class="red">${v}</span>` : v
      ).join(",");
    }
    // -------------------------
    // 現在のスタミナ計算
    // -------------------------
    async function getBattleStamina(playerRef) {
      const snap = await playerRef.get();
      const data = snap.data();

      const maxStamina = 10;
      let stamina = data.battle_stamina;

      let lastRecovery = data.last_battle_recovery.toDate();
      const now = new Date();

      // ▼ 回復処理（複数回復にも対応）
      while (stamina < maxStamina &&
            now >= new Date(lastRecovery.getTime() + 1000 * 60 * 60)) {

        stamina++;
        lastRecovery = new Date(lastRecovery.getTime() + 1000 * 60 * 60);
      }

      // ▼ 回復が発生した場合のみ書き戻す
      if (stamina !== data.battle_stamina) {
        await playerRef.update({
          battle_stamina: stamina,
          last_battle_recovery: lastRecovery
        });
      }

      return { stamina, lastRecovery };
    }
    // -------------------------
    // スタミナ１消費して登録
    // -------------------------
    async function consumeBattleStamina(playerRef) {
      // ▼ まず回復計算を getBattleStamina に任せる
      const { stamina: currentStamina, lastRecovery } = await getBattleStamina(playerRef);

      const maxStamina = 10;
      const now = new Date();

      // ▼ スタミナ不足
      if (currentStamina <= 0) {
        alert("スタミナが足りません！");
        return false;
      }

      // ▼ スタミナ消費
      const newStamina = currentStamina - 1;

      // ▼ ★ MAX → 消費した瞬間に回復タイマーをリセット
      let newLastRecovery = lastRecovery;
      if (currentStamina === maxStamina) {
        newLastRecovery = now;
      }

      // ▼ Firestoreへ書き戻し（最終バトル時刻も記録）
      await playerRef.update({
        battle_stamina: newStamina,
        last_battle_recovery: newLastRecovery,
        last_battle_battle: now
      });

      return true;
    }
    // -------------------------
    // 1回目ロール
    // -------------------------
    document.getElementById("rollBtn").onclick = async () => {
      // battleAttrId が 1 以外ならスタミナ処理しない
      if (String(battleAttrId) !== "1") {
        return;
      }
      const ok = await consumeBattleStamina(playerRef);
      if (!ok) return;  // スタミナ不足なら処理中断

      const eventNo = String(battleAttrId);

      myRolls = [];
      enemyRolls = [];
      myCriticalTargets = [];
      enemyCriticalTargets = [];
      myAchieve = null;
      enemyAchieve = null;

      const myCount = myChar.baseDice + myChar.events[eventNo].dice;
      const enCount = enemyChar.baseDice + enemyChar.events[eventNo].dice;

      const myFirst = rollDice(myCount);
      const enFirst = rollDice(enCount);

      myRolls.push(myFirst);
      enemyRolls.push(enFirst);

      const myCrit = myChar.events[eventNo].critical;
      const enCrit = enemyChar.events[eventNo].critical;

      myCriticalTargets = myFirst.filter(v => v >= myCrit);
      enemyCriticalTargets = enFirst.filter(v => v >= enCrit);

      const log = document.getElementById("battleLog");
      log.innerHTML = "";
      log.innerHTML += `<p>${renderRollResult("自分 1回目ダイス結果", myFirst, myCrit)}</p>`;
      log.innerHTML += `<p>${renderRollResult("相手 1回目ダイス結果", enFirst, enCrit)}</p>`;

      document.getElementById("rollBtn").disabled = true;
      calcAchieve();
    };

    // -------------------------
    // 再ロール
    // -------------------------
    document.getElementById("rerollBtn").onclick = () => {
      const eventNo = String(battleAttrId);
      const myCrit = myChar.events[eventNo].critical;
      const enCrit = enemyChar.events[eventNo].critical;

      let myNext = [];
      let enNext = [];

      if (myCriticalTargets.length > 0) {
        myNext = rollDice(myCriticalTargets.length);
        myRolls.push(myNext);
        myCriticalTargets = myNext.filter(v => v >= myCrit);
      }

      if (enemyCriticalTargets.length > 0) {
        enNext = rollDice(enemyCriticalTargets.length);
        enemyRolls.push(enNext);
        enemyCriticalTargets = enNext.filter(v => v >= enCrit);
      }

      const log = document.getElementById("battleLog");
      const myturn = myRolls.length;
      const enturn = enemyRolls.length;

      if (myNext.length > 0)
        log.innerHTML += `<p>${renderRollResult(`自分 ${myturn}回目ダイス結果`, myNext, myCrit)}</p>`;
      if (enNext.length > 0)
        log.innerHTML += `<p>${renderRollResult(`相手 ${enturn}回目ダイス結果`, enNext, enCrit)}</p>`;
      calcAchieve();
    };

    // -------------------------
    // 達成値計算（戦闘終了）
    // -------------------------
    async function calcAchieve() {
      if (myCriticalTargets.length === 0 && enemyCriticalTargets.length === 0) {
        document.getElementById("rerollBtn").disabled = true;
        const myX = myRolls.length;
        const enX = enemyRolls.length;

        const myMax = Math.max(...myRolls[myRolls.length - 1]);
        const enMax = Math.max(...enemyRolls[enemyRolls.length - 1]);

        myAchieve = 10 * (myX - 1) + myMax;
        enemyAchieve = 10 * (enX - 1) + enMax;

        const log = document.getElementById("battleLog");
        log.innerHTML += `<p>自分 魔法威力：${myAchieve}</p>`;
        log.innerHTML += `<p>相手 魔法威力：${enemyAchieve}</p>`;

        winnerAchieve();

        await updateBattleResult();
        // battleAttrId が 4 以外なら次の属性勝負
        if (String(battleAttrId) !== "4") {          
          document.getElementById("rollBtn").disabled = false;
          renderCharInfo();
        }
      }else{
        document.getElementById("rerollBtn").disabled = false;
        return;
      }
    }

    // -------------------------
    // 勝者判定（達成値）
    // -------------------------
    function winnerAchieve() {
      let winner = "";
      let color = "";
      if (myAchieve > enemyAchieve) {
        winner = `${myChar.name}（自分）`;
        color = "red";
        mywins++;
      } else if (myAchieve < enemyAchieve) {
        winner = `${enemyChar.name}（相手）`;
        color = "blue";
        enemywins++;
      } else {
        winner = "引き分け";
        color = "black";
        drows++;
      }

      const log = document.getElementById("battleLog");
      log.innerHTML += `<h3 style="color:${color}">勝者：${winner}</h3>`;
    }

    // -------------------------
    // 戦闘結果の Firestore 更新（達成値ベース）
    // -------------------------
    async function updateBattleResult() {
      const attrId = String(enemyAttrId);
      const eventsAttrId = String(battleAttrId);

      const myRef = db.collection("characters").doc(String(myChar.characterId));
      const enemyRef = db.collection("characters").doc(String(enemyChar.characterId));
      const champRef = db.collection("champions").doc(attrId);
      const maxChampRef = db.collection("maxAchieveChampions").doc(attrId);

      const champSnap = await champRef.get();
      const maxChampSnap = await maxChampRef.get();

      const champData = champSnap.exists ? champSnap.data() : { championId: 0, winStreak: 0 };
      const maxChampData = maxChampSnap.exists ? maxChampSnap.data() : { championId: 0, maxAchieve: 0 };

      const log = document.getElementById("battleLog");

      // --- 自分の最大威力更新（属性ごと） ---
      const myCurrentMax = myChar.events[eventsAttrId]?.maxAchieve || 0;
      if (myAchieve > myCurrentMax) {
        await myRef.update({
          [`events.${eventsAttrId}.maxAchieve`]: myAchieve
        });
        log.innerHTML += `<p style="color:red">自分の最大威力が更新されました！（${myCurrentMax} → ${myAchieve}）</p>`;
      }

      // --- 相手の最大威力更新（属性ごと） ---
      const enemyCurrentMax = enemyChar.events[eventsAttrId]?.maxAchieve || 0;
      if (enemyAchieve > enemyCurrentMax) {
        await enemyRef.update({
          [`events.${eventsAttrId}.maxAchieve`]: enemyAchieve
        });
        log.innerHTML += `<p style="color:blue">相手の最大威力が更新されました！（${enemyCurrentMax} → ${enemyAchieve}）</p>`;
      }

      // --- 最終処理 ---
      if (String(battleAttrId) == "4") {          
        // --- 勝敗処理（勝敗数→達成値合計で判定） ---
        if (myAchieve > enemyAchieve) {
          await champRef.set({
            championId: myChar.characterId,
            winStreak: 1,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          log.innerHTML += `<p style="color:red">あなたが新しい ${MAGIC_ATTRIBUTE_CHAMPION[attrId]} になりました！</p>`;
        } else {
          const currentStreak = champData.winStreak || 0;
          await champRef.update({
            winStreak: currentStreak + 1,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
        
        // --- 最大威力チャンピオン更新 ---
        const winnerAchieve = Math.max(myAchieve, enemyAchieve);
        const winnerId = (myAchieve > enemyAchieve)
          ? myChar.characterId
          : enemyChar.characterId;

        const currentMaxAchieve = maxChampData.maxAchieve || 0;
        if (winnerAchieve > currentMaxAchieve) {
          await maxChampRef.set({
            championId: winnerId,
            maxAchieve: winnerAchieve,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          if (myAchieve > enemyAchieve) {
            log.innerHTML += `<p style="color:red">あなたが新しい ${MAGIC_ATTRIBUTE_MAXDAMAGE[attrId]} になりました！</p>`;
          }else{
            log.innerHTML += `<p style="color:blue">相手が新しい ${MAGIC_ATTRIBUTE_MAXDAMAGE[attrId]} になりました！</p>`;
          }
        }
      }
    }

    //help表示
    document.getElementById("helpBtn").onclick = openHelpModal;
  </script>
</body>
</html>
