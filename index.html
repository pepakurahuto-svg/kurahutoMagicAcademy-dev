<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>クラフト魔法学院 - ログイン</title>
</head>
<body>
  <h1>クラフト魔法学院</h1>
  <p>クラフト魔法学院へようこそ。</p>
  <p>魔法学院の生徒になって様々な魔法で他の生徒と競おう。</p>

  <h2>ログイン方法を選択してください</h2>
<p>
  ログインを行うことで、<a href="terms.html" target="_blank">利用規約・プライバシーポリシー</a>に同意したものとみなします。
</p>

  <!-- Googleログイン -->
  <button id="googleLoginBtn">Googleでログイン</button>

  <hr>

  <h3>その他のログイン方法</h3>

  <!-- メールログイン -->
  <div>
    <h4>メールでログイン</h4>
    <input id="loginEmail" placeholder="メールアドレス">
    <input id="loginPassword" type="password" placeholder="パスワード">
    <button id="emailLoginBtn">ログイン</button>
  </div>

  <hr>

  <!-- 新規アカウント作成 -->
  <div>
    <h4>メールで新規アカウント作成</h4>
    <input id="newEmail" placeholder="メールアドレス（必須）">
    <input id="newPassword" type="password" placeholder="パスワード（必須）">
    <button id="createAccountBtn">アカウント作成</button>
  </div>

  <p id="status"></p>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <!-- Firebase config -->
  <script src="firebase-config.js"></script>
  <script>
    const status = document.getElementById("status");

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let playerDoc = null;
    let playerRef = null;

    // Googleログイン
    document.getElementById("googleLoginBtn").onclick = async () => {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await auth.signInWithPopup(provider);
        const uid = result.user.uid;

        playerRef = db.collection("players").doc(uid);
        playerDoc = await playerRef.get();
        if (playerDoc.exists) {
          await updatePlayerData();
          location.href = "player_home.html";
        } else {
          location.href = "player_create.html";
        }
      } catch (e) {
        document.getElementById("status").innerText = "ログイン失敗: " + e.message;
      }
    };

    // メールログイン
    document.getElementById("emailLoginBtn").onclick = async () => {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      try {
        const result = await auth.signInWithEmailAndPassword(email, password);
        const uid = result.user.uid;
        
        playerRef = db.collection("players").doc(uid);
        playerDoc = await playerRef.get();
        if (playerDoc.exists) {
          await updatePlayerData();
          location.href = "player_home.html";
        } else {
          location.href = "player_create.html";
        }
      }catch(e) {
  //onsole.log("1543"); // デバッグ用
  //console.log(e); // デバッグ用

  let msg = "";

  // ① JS SDK の標準エラー
  if (e.code === "auth/invalid-email") {
    status.innerText = "メールアドレスの形式が正しくありません。";
    return;
  }

  // ② JS SDK が内部エラーとして REST API JSON を返すケース
  if (e.code === "auth/internal-error") {
    try {
      const parsed = JSON.parse(e.message);
      msg = parsed.error.message;  // INVALID_LOGIN_CREDENTIALS など
    } catch {
      msg = e.message;
    }
  } else {
    msg = e.message;
  }

  // REST API のエラーメッセージに応じて分岐
  if (msg === "INVALID_LOGIN_CREDENTIALS") {
    status.innerText = "メールアドレスまたはパスワードが違います。";
  } else if (msg === "MISSING_EMAIL") {
    status.innerText = "メールアドレスを入力してください。";
  } else if (msg === "INVALID_EMAIL") {
    status.innerText = "メールアドレスの形式が正しくありません。";
  } else {
    status.innerText = "ログイン失敗: " + msg;
  }
}
    };

    // -------------------------
    // プレイヤーデータ構造追加チェック
    // -------------------------
    async function updatePlayerData() {
  const data = playerDoc.data();

  // 🔹 スタミナフィールドが存在しない場合は初期化
  if (
    data.create_stamina === undefined ||
    data.battle_stamina === undefined ||
    data.last_create_recovery === undefined ||
    data.last_battle_recovery === undefined
  ) {
    await playerRef.set({
      create_stamina: 10,
      battle_stamina: 10,
      last_create_recovery: firebase.firestore.FieldValue.serverTimestamp(),
      last_battle_recovery: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  }
    };

    // 新規アカウント作成
    document.getElementById("createAccountBtn").onclick = async () => {
      const email = document.getElementById("newEmail").value;
      const password = document.getElementById("newPassword").value;

      if (!email || !password) {
        alert("メールとパスワードは必須です");
        return;
      }

      try {
        const result = await auth.createUserWithEmailAndPassword(email, password);
        const uid = result.user.uid;

        // プレイヤー名はまだ無いので player_create.html へ
        location.href = "player_create.html";
      } catch (e) {
        document.getElementById("status").innerText = "アカウント作成失敗: " + e.message;
      }
    };
  </script>
</body>
</html>
