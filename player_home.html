<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>クラフト魔法学院 - ホーム</title>
  <style>
    #staminaArea {
      border: 1px solid #888;
      padding: 10px;
      margin-bottom: 10px;
      width: 300px;
    }
    .staminaBar {
      height: 20px;
      background-color: #4caf50;
      transition: width 0.5s;
    }
    #championsArea {
      display: flex;
      overflow-x: auto;   /* 横スクロール維持 */
      gap: 16px;          /* カード間の余白を少し広げる */
      padding: 10px;      /* 内側に余白 */
      white-space: nowrap;
    }

    .champCard {
      flex: 0 0 auto;     /* 横スクロール用 */
      width: 260px;       /* 情報量に合わせて少し広げる */
      border: 2px solid #ddd; /* 枠線を太めに */
      border-radius: 10px;    /* 角丸でカード感UP */
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15); /* 影で立体感 */
      background: var(--attr-color); /* ← JSから渡す色 */
    }

    .champCard h3 {
      margin-top: 0;
      color: #333;
    }

    .champCard h4 {
      margin-bottom: 4px;
      color: #555;
      border-bottom: 1px solid #ccc;
      padding-bottom: 2px;
    }
  </style>
</head>
<body>

  <!-- ログイン情報（右上） -->
  <div id="userInfo" style="position: absolute; top: 10px; right: 10px; text-align: right;">
    <div id="playerName"></div>
    <div>ログイン中：<span id="userEmail"></span></div>
  </div>

  <h1>クラフト魔法学院</h1>
  <p>ようこそ、プレイヤーさん！</p>

  <!-- 🔹 スタミナ表示 -->
  <div id="staminaArea">
    <h3>スタミナ</h3>
    <div>キャラ作成：<span id="createStaminaText"></span></div>
    <div class="staminaBar" id="createStaminaBar"></div>
    <div>バトル：<span id="battleStaminaText"></span></div>
    <div class="staminaBar" id="battleStaminaBar"></div>
    <p id="nextRecoveryText"></p>
  </div>

  <!-- チャンピオン表示 -->
  <h2>チャンピオン一覧</h2>
  <div id="championsArea"></div>

  <h2>あなたのキャラクター一覧</h2>
  <div id="charactersArea"></div>

  <div id="pagingArea">
    <button id="prevPage">前のページ</button>
    <span id="pageInfo"></span>
    <button id="nextPage">次のページ</button>
  </div>

  <p id="status"></p>
  <button onclick="location.href='character_create.html'">キャラ作成</button>
  <button id="battleBtn">バトル開始</button>
  <button onclick="logout()">ログアウト</button>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script src="attributes.js"></script>

  <script>
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let characters = [];
    let currentPage = 1;
    const pageSize = 5;

    let createStamina = 0;
    let battleStamina = 0;
    let lastCreateRecovery = 0;
    let lastBattleRecovery = 0;
    const maxStamina = 10;

    // -------------------------
    // ログイン情報表示
    // -------------------------
    auth.onAuthStateChanged(async user => {
      if (!user) {
        location.href = "index.html";
        return;
      }

      document.getElementById("userEmail").innerText = user.email;
      const uid = user.uid;
      const playerDoc = await db.collection("players").doc(uid).get();

      if (!playerDoc.exists) {
        location.href = "player_create.html";
        return;
      }

      const data = playerDoc.data();
      document.getElementById("playerName").innerText = data.name + " さん";

      // スタミナ情報取得
      createStamina = data.create_stamina;
      battleStamina = data.battle_stamina;
      lastCreateRecovery = data.last_create_recovery.toMillis();
      lastBattleRecovery = data.last_battle_recovery.toMillis();

      updateStaminaDisplay();

      // キャラ一覧取得
      const snap = await db.collection("characters")
        .where("playerId", "==", uid)
        .orderBy("characterId", "asc")
        .get();

      characters = snap.docs.map(doc => doc.data());
      renderPage();

      // 🔹 スタミナ表示を定期更新（リロードなし）
      setInterval(updateStaminaDisplay, 1000);
    });

    // -------------------------
    // スタミナ表示更新
    // -------------------------
    function updateStaminaDisplay() {
      const now = Date.now();

      // 回復計算
      const diffCreate = Math.floor((now - lastCreateRecovery) / (1000 * 60 * 60));
      const diffBattle = Math.floor((now - lastBattleRecovery) / (1000 * 60 * 60));

      if (diffCreate > 0 && createStamina < maxStamina) {
        createStamina = Math.min(maxStamina, createStamina + diffCreate);
        lastCreateRecovery = now;
      }
      if (diffBattle > 0 && battleStamina < maxStamina) {
        battleStamina = Math.min(maxStamina, battleStamina + diffBattle);
        lastBattleRecovery = now;
      }

      // 次回回復までの残り時間
      const nextRecovery = Math.min(
        lastCreateRecovery + 1000 * 60 * 60,
        lastBattleRecovery + 1000 * 60 * 60
      );
      const remainingMinutes = Math.max(0, Math.floor((nextRecovery - now) / (1000 * 60)));

      // 表示更新
      document.getElementById("createStaminaText").innerText = `${createStamina}/${maxStamina}`;
      document.getElementById("battleStaminaText").innerText = `${battleStamina}/${maxStamina}`;
      document.getElementById("createStaminaBar").style.width = `${(createStamina / maxStamina) * 100}%`;
      document.getElementById("battleStaminaBar").style.width = `${(battleStamina / maxStamina) * 100}%`;
      document.getElementById("nextRecoveryText").innerText = `次の回復まであと ${remainingMinutes} 分`;
    }

    // -------------------------
    // ページ描画
    // -------------------------
    function renderPage() {
      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const pageCharacters = characters.slice(start, end);

      const area = document.getElementById("charactersArea");
      area.innerHTML = "";

      pageCharacters.forEach(ch => {
        const div = document.createElement("div");
        div.style.border = "1px solid #ccc";
        div.style.margin = "10px";
        div.style.padding = "10px";

        div.innerHTML = `
          <input type="checkbox" name="charSelect" value="${ch.characterId}">
          <h3>キャラID：${ch.characterId}</h3>
          <p>名前：${ch.name}</p>
          <p>基礎魔力量：${ch.baseDice}</p>
          <h4>属性</h4>
          <ul>
            ${Object.keys(ch.events).map(i => `
              <li>
                属性：${MAGIC_ATTRIBUTES[i]} ／ レベル ${ch.events[i].dice} ／ 発動抵抗 ${ch.events[i].critical}
              </li>
            `).join("")}
          </ul>
          <p>作成日時：${ch.createdAt}</p>
          <p>作成Ver：${ch.createdVersion}</p>
          <p>プレイヤーID：${ch.playerId}</p>
        `;
        area.appendChild(div);
      });

      const totalPages = Math.ceil(characters.length / pageSize);
      document.getElementById("pageInfo").innerText = `${currentPage} / ${totalPages}`;
    }

    // ページング
    document.getElementById("prevPage").onclick = () => {
      if (currentPage > 1) {
        currentPage--;
        renderPage();
      }
    };
    document.getElementById("nextPage").onclick = () => {
      const totalPages = Math.ceil(characters.length / pageSize);
      if (currentPage < totalPages) {
        currentPage++;
        renderPage();
      }
    };

    // バトル開始
    document.getElementById("battleBtn").onclick = () => {
      const selected = document.querySelector('input[name="charSelect"]:checked');
      if (!selected) {
        alert("キャラを選択してください");
        return;
      }
      sessionStorage.setItem("selectedCharId", selected.value);
      location.href = "battle.html";
    };

    // -------------------------
    // チャンピオン表示
    // -------------------------
    async function loadChampions() {
      const area = document.getElementById("championsArea");

      // ★ キャラ情報を取得
      async function loadCharacterInfo(charId) {
        const charSnap = await db.collection("characters")
          .doc(String(charId))
          .get();

        return charSnap.exists ? charSnap.data() : null;
      }

      // ★ プレイヤー名を取得
      async function loadPlayerName(playerId) {
        const playerSnap = await db.collection("players")
          .doc(playerId)
          .get();

        return playerSnap.exists ? playerSnap.data().name : "不明なプレイヤー";
      }

      for (const attrId of Object.keys(MAGIC_ATTRIBUTES)) {
        const attrName = MAGIC_ATTRIBUTES[attrId];

        // 勝ち抜きチャンピオン
        const champSnap = await db.collection("champions").doc(attrId).get();
        let champHtml = "";
        let champChar = null;

        if (champSnap.exists) {
          const data = champSnap.data();
          champChar = await loadCharacterInfo(data.championId);

          if (champChar) {
            const creatorName = await loadPlayerName(champChar.playerId);

            champHtml = `
              <p>
                <strong>勝ち抜きチャンピオン：</strong><br>
                キャラ名：${champChar.name}<br>
                作成者：${creatorName}<br>
                基本魔力：${champChar.baseMagic}<br>
                ダイス：${champChar.baseDice}<br>
                クリティカル：${champChar.critical}<br>
                連勝数：${data.winStreak}
              </p>
            `;
          } else {
            champHtml = `<p>勝ち抜きチャンピオン：キャラ情報が見つかりません</p>`;
          }
        } else {
          champHtml = `<p>勝ち抜きチャンピオン：未設定</p>`;
        }

        // 最大達成値チャンピオン
        const maxSnap = await db.collection("maxAchieveChampions").doc(attrId).get();
        let maxHtml = "";
        let maxChar = null;

        if (maxSnap.exists) {
          const data = maxSnap.data();
          const maxChar = await loadCharacterInfo(data.championId);

          if (maxChar) {
            const creatorName = await loadPlayerName(maxChar.playerId);

            maxHtml = `
              <p>
                <strong>最大達成値チャンピオン：</strong><br>
                キャラ名：${maxChar.name}<br>
                作成者：${creatorName}<br>
                基本魔力：${maxChar.baseMagic}<br>
                ダイス：${maxChar.baseDice}<br>
                クリティカル：${maxChar.critical}<br>
                最大達成値：${data.maxAchieve}
              </p>
            `;
          } else {
            maxHtml = `<p>最大達成値チャンピオン：キャラ情報が見つかりません</p>`;
          }
        } else {
          maxHtml = `<p>最大達成値チャンピオン：未設定</p>`;
        }

        // まとめて表示
        const div = document.createElement("div");
        div.className = "champCard";

        // ★ 属性カラーを適用
        div.style.setProperty("--attr-color", MAGIC_ATTRIBUTE_COLORS[attrId]);

        div.innerHTML = `
          <h3>属性：${attrName}</h3>
          ${champHtml}
          ${maxHtml}
        `;
        area.appendChild(div);
      }
    }

    // ページ読み込み時に実行
    window.onload = () => {
      loadChampions();
    };

    // ログアウト
    function logout() {
      auth.signOut().then(() => location.href = "index.html");
    }
  </script>
</body>
</html>
